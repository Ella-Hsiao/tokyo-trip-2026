const cats=['全部','景點','美食','購物','住宿','交通'];const icons={'景點':'⛩️','美食':'🍜','購物':'🛍️','住宿':'🏨','交通':'🚉'};let day=0,view='day',cat='全部',noteId=null;const storageKey='tokyo2026-v1';let state={done:{},fav:{},notes:{}};try{state={...state,...JSON.parse(localStorage.getItem(storageKey)||'{}')}}catch{}function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}

function setDay(i){day=i;view='day';cat='全部';document.getElementById('search').value='';render()}function setView(v){view=v;cat='全部';render()}function selectToday(){let d=new Date();let n=d.getFullYear()===2026&&d.getMonth()===10?d.getDate()-12:-1;setDay(n>=0&&n<7?n:0)}
function openDayRoute(){let p=items.filter(x=>x.day===day&&!x.optional&&x.cat==='景點');if(!p.length){p=items.filter(x=>x.day===day&&!x.optional&&x.cat==='交通')}if(!p.length)return;let url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p[p.length-1].query)+'&travelmode=transit';if(p.length>1)url+='&waypoints='+encodeURIComponent(p.slice(0,-1).map(x=>x.query).join('|'));window.open(url,'_blank','noopener')}
function toggle(id,key){state[key][id]=!state[key][id];persist();render()}function openNote(id){noteId=id;let p=items.find(x=>x.id===id);document.getElementById('noteTitle').textContent=p.name+'｜備註';document.getElementById('noteInput').value=state.notes[id]||'';document.getElementById('noteDialog').showModal()}function saveNote(){state.notes[noteId]=document.getElementById('noteInput').value;persist();document.getElementById('noteDialog').close();render()}
function render(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('daystrip').innerHTML=days.map((d,i)=>`<button class="day ${view==='day'&&day===i?'active':''}" onclick="setDay(${i})"><small>${d[1]}曜日</small><b>${d[0]}</b></button>`).join('');document.getElementById('daytitle').textContent=view==='day'?days[day][2]:({'all':'全部地點','fav':'我的收藏','hotel':'住宿與交通'})[view];document.getElementById('daysub').textContent=view==='day'?days[day][3]:'所有地點皆可直接開啟 Google Maps；搜尋或篩選快速定位。';document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter ${cat===c?'active':''}" onclick="cat=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${c}</button>`).join('');let term=document.getElementById('search').value.toLocaleLowerCase();let list=items.filter(p=>(view==='day'?p.day===day:view==='fav'?state.fav[p.id]:view==='hotel'?['住宿','交通'].includes(p.cat):true)&&(cat==='全部'||p.cat===cat)&&(!term||(p.name+' '+p.desc+' '+days[p.day][2]).toLocaleLowerCase().includes(term)));document.getElementById('count').textContent=`顯示 ${list.length} 個地點${view==='day'?' · 備選餐廳以「候選」標示':''}`;document.getElementById('progress').textContent='行程進度 '+items.filter(p=>state.done[p.id]).length+' / '+items.length;let html='';if(view!=='day'){let last=-1;list.forEach(p=>{if(last!==p.day){last=p.day;html+=`<div class="section">${days[p.day][0]} · ${days[p.day][2]}</div>`}html+=card(p)})}else{html=list.map(card).join('')}document.getElementById('places').innerHTML=html||'<div class="empty">🔎 沒有符合條件的地點</div>'}
function card(p){return `<article class="place ${state.done[p.id]?'done':''}"><div class="top"><div class="emoji">${icons[p.cat]}</div><div class="placeinfo"><div class="placename">${escapeHTML(p.name)}${p.optional?'<span class="tag">候選</span>':''}</div><div class="meta">${escapeHTML(p.cat)}${p.desc?' · '+escapeHTML(p.desc):''}</div>${state.notes[p.id]?`<div class="meta">📝 ${escapeHTML(state.notes[p.id])}</div>`:''}</div><button class="star ${state.fav[p.id]?'on':''}" aria-label="收藏" onclick="toggle('${p.id}','fav')">★</button></div><div class="actions"><a class="action primary" target="_blank" rel="noopener" href="${maps(p.query)}">📍 查看地圖</a><a class="action" target="_blank" rel="noopener" href="${dir(p.query)}">🧭 導航</a><button class="check ${state.done[p.id]?'checked':''}" onclick="toggle('${p.id}','done')" aria-label="標記完成">✓</button></div><div style="margin-top:9px;text-align:right"><button style="background:none;border:0;color:#658086;font-size:12px;padding:5px" onclick="openNote('${p.id}')">✎ ${state.notes[p.id]?'編輯備註':'新增備註'}</button></div></article>`}
document.getElementById('search').addEventListener('input',render);selectToday();
